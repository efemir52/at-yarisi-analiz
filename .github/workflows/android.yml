
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip \
            openjdk-17-jdk autoconf automake \
            libtool pkg-config zlib1g-dev \
            libffi-dev libssl-dev
          python -m pip install --upgrade pip
          pip install buildozer cython

                  - name: Accept Android SDK licenses
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$(find "$SDK" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager bulunamadı"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses

      - name: Install Android build tools
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$(find "$SDK" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" --sdk_root="$SDK" "platform-tools" "build-tools;37.0.0"

            - name: Accept Android SDK licenses
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$(find "$SDK" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager bulunamadı"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses

      - name: Install Android build tools
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$(find "$SDK" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" --sdk_root="$SDK" "platform-tools" "build-tools;37.0.0"

      - name: Build APK
        run: buildozer android debug
      

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: AtYarisiAnaliz-APK
          path: bin/*.apk
